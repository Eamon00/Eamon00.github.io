<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race2Berlin live map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">

<style>
  :root {
    --ink:#16324f;
    --paper:#ffffff;
    --line:#d5dbe3;
    --done:#1f7a4d;
    --accent:#d4382c;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    padding: 8px 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }

  header label { font-weight: 600; }

  input {
    font: inherit;
    width: 9.5em;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  button {
    font: inherit;
    padding: 6px 10px;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background: var(--ink);
    color: var(--paper);
  }

  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  #status {
    margin-left: auto;
    font-size: .85rem;
  }

  #status.error {
    color: var(--accent);
    font-weight: 600;
  }

  #map { flex: 1; min-height: 0; }

  /* Team image markers */
  .team-icon {
    border-radius: 50%;
    object-fit: contain;
    background: white;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,.45);
  }

  .popup h3 {
    margin: 0 0 2px;
    font-size: 1.05rem;
  }

  .popup .loc {
    margin: 0 0 8px;
    font-style: italic;
  }

  .popup ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 220px;
    overflow: auto;
  }

  .popup li {
    padding: 3px 0 3px 8px;
    border-left: 3px solid var(--line);
    margin-bottom: 4px;
  }

  .popup li.latest {
    border-left-color: var(--accent);
    font-weight: 600;
  }

  .popup .when {
    display: block;
    font-size: .8rem;
    font-weight: 400;
    opacity: .75;
  }
</style>
</head>

<body>

<header>
  <label for="team">Find a team</label>
  <input id="team" list="teamlist" inputmode="numeric" placeholder="Team number" autocomplete="off">
  <datalist id="teamlist"></datalist>
  <button id="fit" type="button">Show all teams</button>
  <span id="status" role="status">Loading teams…</span>
</header>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

// Settings
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRo138moOhBgXWB1LgD-LIhooS8r7bPTQLfkTvCW6hM-A1q4gTe-W2mFSSrHkjQHoj9yDOqs8x6723K/pub?gid=1762194329&single=true&output=csv";

const REFRESH_MS = 5 * 60 * 1000;
const FINISH = [52.5200, 13.4050]; // Berlin
const NON_TIME_COLS = ["Team Number", "Location", "Lat", "Lon", "Geocoded for"];
const ICON_SIZE = 40;
// 

const map = L.map("map").setView(FINISH, 5);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const cluster = L.markerClusterGroup({
  maxClusterRadius: 30,
  showCoverageOnHover: false
});

map.addLayer(cluster);

const markers = {};
let firstLoad = true;
const statusEl = document.getElementById("status");

const esc = s => String(s).replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

const clean = v => {
  v = (v || "").trim().replace(/^"|"$/g, "").trim();
  return v && v !== "-" ? v : "";
};

function popupHtml(team, location, notes) {
  const items = notes.map((n, i) =>
    `<li class="${i === notes.length - 1 ? "latest" : ""}">
      <span class="when">${esc(n.when)}</span>${esc(n.text)}
    </li>`
  ).join("");

  return `<div class="popup">
    <h3>Team ${esc(team)}</h3>
    <p class="loc">${esc(location)}</p>
    <ul>${items}</ul>
  </div>`;
}

async function load() {
  try {
    const res = await fetch(CSV_URL + "&t=" + Date.now());
    if (!res.ok) throw new Error(res.status);

    const { data, meta } = Papa.parse(await res.text(), {
      header: true,
      skipEmptyLines: true,
      transformHeader: h => h.trim()
    });

    const timeCols = meta.fields.filter(f => !NON_TIME_COLS.includes(f));

    const openTeam = Object.keys(markers).find(t => markers[t].isPopupOpen());

    cluster.clearLayers();
    Object.keys(markers).forEach(k => delete markers[k]);

    const bounds = [];

    data.forEach(row => {
      const team = clean(row["Team Number"]);
      const lat = parseFloat(row["Lat"]);
      const lon = parseFloat(row["Lon"]);

      if (!team || isNaN(lat) || isNaN(lon)) return;

      const location = clean(row["Location"]);

      const notes = timeCols
        .map(c => ({ when: c, text: clean(row[c]) }))
        .filter(n => n.text);

      // Load the team's individual PNG from the Icons folder
      const icon = L.icon({
        iconUrl: new URL(`Icons/${team}.png`, window.location.href).href,
        iconSize: [ICON_SIZE, ICON_SIZE],
        iconAnchor: [ICON_SIZE / 2, ICON_SIZE / 2],
        popupAnchor: [0, -ICON_SIZE / 2],
        className: "team-icon"
      });

      markers[team] = L.marker([lat, lon], {
        icon,
        title: "Team " + team,
        alt: "Team " + team
      }).bindPopup(popupHtml(team, location, notes), {
        maxWidth: 320
      });

      cluster.addLayer(markers[team]);
      bounds.push([lat, lon]);
    });

    document.getElementById("teamlist").innerHTML =
      Object.keys(markers)
        .sort((a, b) => a - b)
        .map(t => `<option value="${esc(t)}">`)
        .join("");

    if (firstLoad && bounds.length) {
      map.fitBounds(bounds, { padding: [30, 30] });
      firstLoad = false;
    }

    if (openTeam && markers[openTeam]) {
      markers[openTeam].openPopup();
    }

    statusEl.className = "";
    statusEl.textContent =
      `${bounds.length} teams, updated ${new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      })}`;

  } catch (e) {
    console.error("Map update error:", e);
    statusEl.className = "error";
    statusEl.textContent = "Couldn't load team data. Retrying in 5 minutes.";
  }
}

// Team search
document.getElementById("team").addEventListener("change", e => {
  const m = markers[e.target.value.trim()];

  if (m) {
    cluster.zoomToShowLayer(m, () => {
      map.setView(m.getLatLng(), Math.max(map.getZoom(), 10));
      m.openPopup();
    });
  }
});

// Show all teams
document.getElementById("fit").addEventListener("click", () => {
  const b = Object.values(markers).map(m => m.getLatLng());

  if (b.length) {
    map.fitBounds(b, { padding: [30, 30] });
  }
});

// Initial load and automatic refresh
load();
setInterval(load, REFRESH_MS);

</script>
</body>
</html>
